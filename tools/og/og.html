<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Meringo share card</title>
<!-- The house kit, served from this site: no CDN. Render it over HTTP from the repo root (see README.md). -->
<link rel="stylesheet" href="/colors_and_type.css">
<link rel="stylesheet" href="/house.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { -webkit-font-smoothing: antialiased; }
  .card {
    box-sizing: border-box; width: 1200px; height: 630px; padding: 52px 80px 44px;
    display: grid; grid-template-columns: 1fr 520px; grid-template-rows: auto 1fr auto; column-gap: 56px;
    border-top: 6px solid var(--color-gold);                                  /* Sign */
  }
  .brand { grid-column: 1 / -1; margin: 0; display: flex; flex-direction: column; gap: 6px; }
  .brand .h-wordmark { font-size: 40px; }
  .brand .h-desc { font-size: 22px; }
  h1 {
    grid-column: 1 / -1; align-self: center; margin: 0;
    font: var(--w-display) 96px/1.04 var(--font-display); letter-spacing: -0.01em;
  }
  .foot { align-self: end; margin: 0; font: 400 22px/1.4 var(--font-ui); color: var(--color-text-1); }
  .foot .url { display: block; margin-bottom: 6px; font-size: 24px; color: var(--color-text-0); }
  .foot b { font-weight: 600; color: var(--color-text-0); }
  .receipt { align-self: end; margin: 0; }
  .receipt .h-ledger { font-size: 21px; }
  .receipt .h-ledger th { font-size: 18px; }
  .receipt .h-ledger td:last-child { text-align: right; padding-right: 0; }
  .receipt .h-stamp { margin: 0 0 10px; font-size: 17px; }
</style>
</head>
<body class="h-plate">
<main class="card">
  <p class="brand"><span class="h-wordmark">Meringo</span><span class="h-desc">a music player for Android</span></p>
  <h1>Your music.<br>Exactly as recorded.</h1>
  <p class="foot"><span class="url">meringo.app</span>Free to install, with a seven-day full trial. Then <b>$9.99, once.</b> No subscription.</p>
  <figure class="receipt">
    <p class="h-stamp">A real receipt from Meringo 1.28.5: a 24-bit/96 kHz FLAC sent to a Qudelix 5K.</p>
    <table class="h-ledger">
      <tr><th scope="row">Sent to your DAC</th><td>cb459147…295adf</td></tr>
      <tr><th scope="row">Re-decoded from the file</th><td>cb459147…295adf</td></tr>
      <tr><th scope="row">Result</th><td class="h-verdict">BIT-IDENTICAL ✓</td></tr>
    </table>
  </figure>
</main>
</body>
</html>
